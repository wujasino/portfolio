name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:prepare
        env:
          RAILS_ENV: test
      - name: Run test suite
        run: bin/rails test
        env:
          RAILS_ENV: test
      - name: Check that the app boots
        run: bin/rails runner "puts 'Rails app loaded OK'"
